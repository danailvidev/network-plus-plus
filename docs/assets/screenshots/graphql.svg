<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network++ GraphQL preview</title>
  <desc id="desc">A stylized preview of GraphQL operation details, variables, and errors.</desc>
  <rect width="1280" height="760" rx="34" fill="#0c1020"/>
  <rect x="64" y="64" width="1152" height="632" rx="30" fill="#111827" stroke="#263247"/>
  <text x="104" y="126" fill="#f8fbff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">GraphQL without the guesswork</text>
  <text x="104" y="164" fill="#95a5c6" font-family="Inter, Arial, sans-serif" font-size="18">See operations, variables, timings, and errors as first-class request data.</text>
  <rect x="104" y="216" width="420" height="388" rx="22" fill="#0b1220" stroke="#25344f"/>
  <text x="136" y="260" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Operations</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15">
    <rect x="136" y="292" width="340" height="48" rx="14" fill="#172033"/><text x="160" y="322" fill="#e5edff">query ProductList</text><text x="400" y="322" fill="#86efac">96 ms</text>
    <rect x="136" y="356" width="340" height="48" rx="14" fill="#1f2937"/><text x="160" y="386" fill="#e5edff">mutation CheckoutSummary</text><text x="390" y="386" fill="#fca5a5">500</text>
    <rect x="136" y="420" width="340" height="48" rx="14" fill="#172033"/><text x="160" y="450" fill="#e5edff">query ViewerPreferences</text><text x="400" y="450" fill="#86efac">44 ms</text>
  </g>
  <rect x="560" y="216" width="584" height="388" rx="22" fill="#0b1220" stroke="#25344f"/>
  <text x="592" y="260" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Selected operation</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="16">
    <text x="592" y="306" fill="#c4b5fd">mutation</text><text x="682" y="306" fill="#f8fbff">CheckoutSummary($cartId: ID!) {</text>
    <text x="620" y="338" fill="#f8fbff">checkout(cartId: $cartId) {</text>
    <text x="648" y="370" fill="#f8fbff">total</text>
    <text x="648" y="402" fill="#f8fbff">items { sku quantity }</text>
    <text x="620" y="434" fill="#f8fbff">}</text>
    <text x="592" y="466" fill="#f8fbff">}</text>
  </g>
  <rect x="592" y="504" width="492" height="54" rx="14" fill="#3b0d14" stroke="#7f1d1d"/>
  <text x="616" y="537" fill="#fecaca" font-family="Inter, Arial, sans-serif" font-size="15">Error: checkout service timed out after 800 ms</text>
</svg>
