    <rect x="846" y="270" width="328" height="42" rx="12" fill="#172033"/><text x="864" y="296" fill="#e5edff">3 duplicate groups</text><text x="1038" y="296" fill="#93c5fd">12 calls</text>
    <rect x="846" y="326" width="328" height="42" rx="12" fill="#172033"/><text x="864" y="352" fill="#e5edff">5 GraphQL operations</text><text x="1048" y="352" fill="#fca5a5">1 error</text>
    <rect x="846" y="382" width="328" height="42" rx="12" fill="#172033"/><text x="864" y="408" fill="#e5edff">Slow endpoint</text><text x="1036" y="408" fill="#fcd34d">842 ms</text>
    <rect x="846" y="438" width="328" height="42" rx="12" fill="#172033"/><text x="864" y="464" fill="#e5edff">Redacted export ready</text><text x="1040" y="464" fill="#86efac">local</text>
  </g>
  <rect x="56" y="568" width="1168" height="126" rx="18" fill="#0f172a" stroke="#263247"/>
