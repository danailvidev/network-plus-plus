  <rect x="624" y="136" width="116" height="30" rx="15" fill="#1e3a8a"/>
  <text x="654" y="156" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="13">Errors</text>
  <rect x="752" y="136" width="112" height="30" rx="15" fill="#164e63"/>
  <text x="779" y="156" fill="#cffafe" font-family="Inter, Arial, sans-serif" font-size="13">GraphQL</text>
  <rect x="876" y="136" width="96" height="30" rx="15" fill="#14532d"/>
  <text x="902" y="156" fill="#dcfce7" font-family="Inter, Arial, sans-serif" font-size="13">Slow</text>
  <rect x="1002" y="136" width="160" height="30" rx="10" fill="#172033" stroke="#34445f"/>
  <text x="1030" y="156" fill="#e5edff" font-family="Inter, Arial, sans-serif" font-size="13">Export filtered</text>
