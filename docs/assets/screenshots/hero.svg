  <text x="82" y="634" fill="#93a4c7" font-family="Inter, Arial, sans-serif" font-size="13">Summary</text>
  <text x="184" y="634" fill="#93a4c7" font-family="Inter, Arial, sans-serif" font-size="13">Headers</text>
  <text x="286" y="634" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="13">GraphQL</text>
  <text x="392" y="634" fill="#93a4c7" font-family="Inter, Arial, sans-serif" font-size="13">Timing</text>
  <text x="492" y="634" fill="#93a4c7" font-family="Inter, Arial, sans-serif" font-size="13">Export</text>
  <rect x="82" y="654" width="520" height="16" rx="8" fill="#172033"/>
  <rect x="626" y="654" width="280" height="16" rx="8" fill="#172033"/>
  <rect x="930" y="654" width="218" height="16" rx="8" fill="#172033"/>
