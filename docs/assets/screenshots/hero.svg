<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network++ DevTools panel preview</title>
  <desc id="desc">A stylized preview of the Network++ request table, insights panel, and request details drawer.</desc>
  <rect width="1280" height="760" rx="34" fill="#0b1020"/>
  <rect x="28" y="28" width="1224" height="704" rx="24" fill="#111827" stroke="#263247"/>
  <rect x="28" y="28" width="1224" height="54" rx="24" fill="#172033"/>
  <circle cx="64" cy="55" r="7" fill="#ef4444"/>
  <circle cx="88" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="112" cy="55" r="7" fill="#22c55e"/>
  <text x="146" y="61" fill="#e5edff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Network++</text>
  <text x="270" y="61" fill="#8ea3c7" font-family="Inter, Arial, sans-serif" font-size="14">Enhanced request visibility for Chrome DevTools</text>
