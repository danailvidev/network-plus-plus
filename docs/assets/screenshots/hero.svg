    <text x="82" y="286" fill="#7485a8">Method</text><text x="172" y="286" fill="#7485a8">Status</text><text x="264" y="286" fill="#7485a8">Path</text><text x="626" y="286" fill="#7485a8">Time</text>
    <rect x="74" y="306" width="690" height="38" rx="10" fill="#172033"/>
    <text x="94" y="330" fill="#bfdbfe">POST</text><text x="178" y="330" fill="#fecaca">500</text><text x="264" y="330" fill="#e5edff">/graphql CheckoutSummary</text><text x="628" y="330" fill="#fcd34d">842 ms</text>
    <rect x="74" y="354" width="690" height="38" rx="10" fill="#111827"/>
    <text x="94" y="378" fill="#bbf7d0">GET</text><text x="178" y="378" fill="#bbf7d0">200</text><text x="264" y="378" fill="#e5edff">/api/products?category=tools</text><text x="628" y="378" fill="#cbd5e1">118 ms</text>
    <rect x="74" y="402" width="690" height="38" rx="10" fill="#172033"/>
    <text x="94" y="426" fill="#bfdbfe">POST</text><text x="178" y="426" fill="#fef3c7">304</text><text x="264" y="426" fill="#e5edff">/graphql ProductRecommendations</text><text x="628" y="426" fill="#cbd5e1">96 ms</text>
    <rect x="74" y="450" width="690" height="38" rx="10" fill="#111827"/>
    <text x="94" y="474" fill="#bbf7d0">GET</text><text x="178" y="474" fill="#fecaca">404</text><text x="264" y="474" fill="#e5edff">/api/account/preferences</text><text x="628" y="474" fill="#cbd5e1">211 ms</text>
  </g>
  <rect x="820" y="212" width="404" height="332" rx="18" fill="#0f172a" stroke="#263247"/>
  <text x="846" y="246" fill="#e5edff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Insights</text>
