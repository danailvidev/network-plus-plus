<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network++ filtering preview</title>
  <desc id="desc">A stylized preview of structured request filtering and saved filter chips.</desc>
  <rect width="1280" height="760" rx="34" fill="#07111f"/>
  <rect x="70" y="72" width="1140" height="616" rx="28" fill="#101827" stroke="#25344f"/>
  <text x="110" y="132" fill="#f8fbff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Filter requests like code</text>
  <text x="110" y="170" fill="#95a5c6" font-family="Inter, Arial, sans-serif" font-size="18">Combine free text with fields, comparisons, chips, and saved searches.</text>
  <rect x="110" y="222" width="804" height="76" rx="18" fill="#0b1220" stroke="#35445f"/>
  <text x="144" y="268" fill="#dbeafe" font-family="JetBrains Mono, Consolas, monospace" font-size="24">status:&gt;=400 method:POST graphql:true</text>
  <rect x="936" y="222" width="162" height="76" rx="18" fill="#2563eb"/>
  <text x="978" y="268" fill="#eff6ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Save Filter</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="110" y="334" width="112" height="42" rx="21" fill="#1e3a8a"/><text x="145" y="361" fill="#dbeafe">All</text>
    <rect x="238" y="334" width="136" height="42" rx="21" fill="#7f1d1d"/><text x="275" y="361" fill="#fee2e2">Errors</text>
    <rect x="390" y="334" width="154" height="42" rx="21" fill="#164e63"/><text x="426" y="361" fill="#cffafe">GraphQL</text>
    <rect x="560" y="334" width="124" height="42" rx="21" fill="#713f12"/><text x="597" y="361" fill="#fef3c7">Slow</text>
    <rect x="700" y="334" width="150" height="42" rx="21" fill="#14532d"/><text x="731" y="361" fill="#dcfce7">Cached</text>
  </g>
  <rect x="110" y="420" width="968" height="178" rx="20" fill="#0b1220" stroke="#25344f"/>
  <text x="140" y="462" fill="#95a5c6" font-family="Inter, Arial, sans-serif" font-size="15">Recent and saved filters</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="15">
    <rect x="140" y="492" width="294" height="40" rx="12" fill="#172033"/><text x="160" y="518" fill="#dbeafe">domain:api.example.test</text>
    <rect x="454" y="492" width="270" height="40" rx="12" fill="#172033"/><text x="474" y="518" fill="#dbeafe">path:/checkout !status:2xx</text>
    <rect x="744" y="492" width="260" height="40" rx="12" fill="#172033"/><text x="764" y="518" fill="#dbeafe">method:POST slow:true</text>
    <rect x="140" y="548" width="358" height="40" rx="12" fill="#172033"/><text x="160" y="574" fill="#dbeafe">graphql:true operation:Checkout</text>
  </g>
</svg>
